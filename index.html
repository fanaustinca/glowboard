<head>

<body>
<a class="skip" href="#main">Skip to content</a>
<div id="modebar" class="modebar" hidden>Demo mode — data is stored only in this browser. Add your Firebase config in <code>js/firebase-config.js</code> to go live.</div>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="GlowBoard home"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 22c0-8 5-12 14-12 0 9-4 14-12 14" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>

  </div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
